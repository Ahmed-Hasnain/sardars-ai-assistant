services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${SARDARS_DB_USER}
      POSTGRES_DB: ${SARDARS_DB_NAME}
      POSTGRES_PASSWORD: ${SARDARS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SARDARS_DB_USER} -d ${SARDARS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: